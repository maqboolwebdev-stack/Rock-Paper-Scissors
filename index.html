<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/png" href="images/rps-Icon.png" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Aldrich&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Atma:wght@300;400;500;600;700&display=swap");
    </style>
  </head>
  <body>
    <h1>Rock, Paper, Scissors Game</h1>
    <h2></h2>
    <div class="images-container">
      <img class="scissors" src="images/scissors.png" alt="Scissors icon" />
      <img class="rock" src="images/rock.png" alt="Rock icon" />
      <img class="paper" src="images/paper.png" alt="Paper icon" />
    </div>

    <div class="data-container">
      <p class="svg-alignment" >
        <span class="icon"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z"
            />
          </svg>
        </span>
        : Your Score: <span class="human-score">0</span>
      </p>

      <p class="svg-alignment" >
        <span class="icon"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M4.499 8.248h15m-15 7.501h15"
            />
          </svg>
        </span>
        : Tied!: <span class="tie">0</span>
      </p>

      <p class="svg-alignment" >
        <span class="icon"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            class="size-6"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M9 17.25v1.007a3 3 0 0 1-.879 2.122L7.5 21h9l-.621-.621A3 3 0 0 1 15 18.257V17.25m6-12V15a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 15V5.25m18 0A2.25 2.25 0 0 0 18.75 3H5.25A2.25 2.25 0 0 0 3 5.25m18 0V12a2.25 2.25 0 0 1-2.25 2.25H5.25A2.25 2.25 0 0 1 3 12V5.25"
            />
          </svg>
        </span>
        : Computer Score: <span class="computer-score">0</span>
      </p>
    </div>

    <div class="result-container">
      <p class="result"></p>
      <p class="both-choices"></p>
    </div>

    <button class="reset-btn svg-alignment">
      Reset Game
      <span class="icon"
        ><svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0 3.181 3.183a8.25 8.25 0 0 0 13.803-3.7M4.031 9.865a8.25 8.25 0 0 1 13.803-3.7l3.181 3.182m0-4.991v4.99"
          />
        </svg>
      </span>
    </button>

    <script defer src="script.js"></script>
  </body>
</html>
